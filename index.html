<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AYTO Solver 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #0e101f; --card: #1e213c; --primary: #346fff; --danger: #ff4757; --text: #fff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        header { background: linear-gradient(135deg, #ff00cc, #3333ff); padding: 15px; text-align: center; }
        .container { padding: 10px; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        input, select, button { padding: 10px; border-radius: 8px; border: none; background: #2d304e; color: white; }
        button.primary { background: var(--primary); width: 100%; font-weight: bold; }
        button.danger { background: var(--danger); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #16192c; display: flex; border-top: 1px solid #333; }
        .bottom-nav button { flex: 1; background: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 0; }
        .bottom-nav button.active { color: var(--primary); }
        
        /* Mobile Table Fix */
        .table-wrap { overflow-x: auto; background: var(--card); border-radius: 8px; }
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { padding: 10px 5px; border: 1px solid #2d304e; text-align: center; min-width: 70px; }
        .sticky-col { position: sticky; left: 0; background: var(--card) !important; font-weight: bold; z-index: 5; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0">AYTO Solver 2026</h2>
</header>

<div class="container">
    <div id="page-users" class="page active">
        <div class="card">
            <h3>Teilnehmer</h3>
            <button class="primary" id="prefill" style="margin-bottom:15px">Auto-Fill Cast</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div id="listA"><h4>Frauen</h4></div>
                <div id="listB"><h4>Männer</h4></div>
            </div>
            <div class="row">
                <button id="addA" style="flex:1">+ Frau</button>
                <button id="addB" style="flex:1">+ Mann</button>
            </div>
        </div>
    </div>

    <div id="page-matchbox" class="page">
        <div class="card">
            <h3>Matchbox</h3>
            <div class="row">
                <select id="tbA" style="flex:1"></select>
                <select id="tbB" style="flex:1"></select>
            </div>
            <div class="row">
                <select id="tbType" style="flex:1">
                    <option value="NM">No Match</option>
                    <option value="PM">Perfect Match</option>
                </select>
                <button id="addTB" class="primary" style="flex:1">Hinzufügen</button>
            </div>
            <div id="tbList" style="margin-top:15px"></div>
        </div>
    </div>

    <div id="page-nights" class="page">
        <div class="card">
            <h3>Matching Night</h3>
            <button id="addNight" class="primary">Eintragen</button>
            <div id="nights" style="margin-top:10px"></div>
        </div>
    </div>

    <div id="page-ergebnisse" class="page">
        <div class="card">
            <button id="solveBtn" class="primary">BERECHNEN</button>
            <div id="summary" style="margin: 15px 0;"></div>
            <div id="matrix"></div>
        </div>
    </div>
</div>

<nav class="bottom-nav" id="nav">
    <button class="active" data-target="page-users">Teilnehmer</button>
    <button data-target="page-matchbox">Matchbox</button>
    <button data-target="page-nights">Nights</button>
    <button data-target="page-ergebnisse">Ergebnis</button>
</nav>

<script src="app.js"></script>

</body>
</html>
