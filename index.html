<!doctype html>
<html lang="de">
<head>
  <meta name="app-version" content="2025.10.27.8">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AYTO Solver 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <header>
    <img class="logo" src="ayto-logo.png" alt="Are You The One Logo" style="width:80px">
    <h1>AYTO Solver 2026</h1>
  </header>

  <main>
    <section id="page-teilnehmer" class="page active">
      <div class="card stack">
        <h2>👥 Teilnehmer</h2>
        <button id="prefill" class="ghost">Staffel 2026 laden</button>
        <div class="row">
          <div style="flex:1"><h3>Frauen</h3><div id="listA" class="stack"></div><button id="addA" class="primary small">+ Frau</button></div>
          <div style="flex:1"><h3>Männer</h3><div id="listB" class="stack"></div><button id="addB" class="primary small">+ Mann</button></div>
        </div>
      </div>
    </section>

    <section id="page-matchbox" class="page">
      <div class="card stack">
        <h2>💞 Matchbox</h2>
        <div class="row">
          <select id="tbA"></select>
          <select id="tbB"></select>
        </div>
        <select id="tbType">
          <option value="NM">No Match (NM)</option>
          <option value="PM">Perfect Match (PM)</option>
        </select>
        <button id="addTB" class="primary">Eintrag hinzufügen</button>
        <div id="tbList" class="stack"></div>
      </div>
    </section>

    <section id="page-nights" class="page">
      <div class="card stack">
        <h2>🌙 Matching Nights</h2>
        <button id="addNight" class="primary">Neue Night eintragen</button>
        <div id="nights" class="stack"></div>
      </div>
    </section>

    <section id="page-ergebnisse" class="page">
      <div class="card stack">
        <button id="solveBtn" class="primary" style="padding:20px; font-size:18px">🚀 BERECHNEN</button>
        <div id="summary"></div>
        <div id="matrix"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-target="page-teilnehmer" class="active">👥<span>Teilnehmer</span></button>
    <button data-target="page-matchbox">💞<span>Matchbox</span></button>
    <button data-target="page-nights">🌙<span>Nights</span></button>
    <button data-target="page-ergebnisse">📊<span>Ergebnis</span></button>
  </nav>

  <div id="overlay">
    <div class="overlay-box">
      <img src="ayto-logo.png" class="overlay-logo">
      <h3 id="overlay-title">Berechnung läuft...</h3>
      <div class="progress"><div class="bar" id="pBar"></div></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
