<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AYTO Solver 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #0e101f;
            --card: #1e213c;
            --primary: #346fff;
            --danger: #ff4757;
            --success: #00d2d3;
            --text: #ffffff;
            --muted: #a4b0be;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; 
        }

        /* Header mit Gradient wie auf deinem Bild */
        header {
            background: linear-gradient(135deg, #ff00cc, #3333ff);
            padding: 25px 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .logo-box {
            background: white; width: 60px; height: 60px; margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center; border-radius: 12px;
        }
        .logo-box img { width: 50px; }

        .container { padding: 0 15px; max-width: 800px; margin: 0 auto; }
        .page { display: none; }
        .page.active { display: block; }

        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        
        /* Buttons & Inputs */
        .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        input, select, button { 
            padding: 12px; border-radius: 10px; border: none; font-size: 14px; background: #2d304e; color: white;
        }
        button { cursor: pointer; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.96); }
        button.primary { background: var(--primary); width: 100%; }
        button.danger { background: var(--danger); width: auto; }

        /* Navigation mit Icons */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #16192c; display: flex; border-top: 1px solid #333; z-index: 100;
        }
        .bottom-nav button {
            background: none; color: var(--muted); display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 11px; gap: 5px; flex: 1; border-radius: 0;
        }
        .bottom-nav button.active { color: var(--primary); }
        .nav-icon { font-size: 20px; }

        /* Matrix Mobile Fix */
        .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #333; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; }
        th, td { padding: 12px 10px; border: 1px solid #2d304e; text-align: center; min-width: 85px; }
        .sticky-col { position: sticky; left: 0; background: #1e213c !important; z-index: 10; font-weight: bold; border-right: 2px solid var(--primary); }

        /* Lade-Overlay */
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }
        #overlay.show { display: flex; }
        .loader-card { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; width: 80%; }
        .progress-bar { background: #2d304e; height: 10px; border-radius: 5px; margin-top: 15px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Are_You_The_One_Logo.svg/1200px-Are_You_The_One_Logo.svg.png" alt="AYTO">
    </div>
    <h1 style="margin:0; font-size: 22px;">AYTO Solver 2026</h1>
</header>

<div class="container">
    <div id="page-users" class="page active">
        <div class="card">
            <h3>👥 Teilnehmer</h3>
            <button class="primary" id="prefill" style="margin-bottom:20px">Auto-Fill Cast</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div id="listA"><h4 style="color:#ff79c6">Frauen</h4></div>
                <div id="listB"><h4 style="color:#8be9fd">Männer</h4></div>
            </div>
            <div class="row" style="margin-top:15px">
                <button id="addA" style="flex:1">+ Frau</button>
                <button id="addB" style="flex:1">+ Mann</button>
            </div>
        </div>
    </div>

    <div id="page-matchbox" class="page">
        <div class="card">
            <h3>💞 Matchbox</h3>
            <div class="stack">
                <div class="row">
                    <select id="tbA" style="flex:1"></select>
                    <select id="tbB" style="flex:1"></select>
                </div>
                <div class="row">
                    <select id="tbType" style="flex:1">
                        <option value="NM">No Match (NM)</option>
                        <option value="PM">Perfect Match (PM)</option>
                    </select>
                    <button id="addTB" class="primary" style="flex:1">Hinzufügen</button>
                </div>
            </div>
            <div id="tbList" style="margin-top:20px"></div>
        </div>
    </div>

    <div id="page-nights" class="page">
        <div class="card">
            <h3>🌙 Matching Night</h3>
            <button id="addNight" class="primary">Night eintragen</button>
            <div id="nights" style="margin-top:20px"></div>
        </div>
    </div>

    <div id="page-ergebnisse" class="page">
        <div class="card">
            <button id="solveBtn" class="primary" style="padding:15px">BERECHNEN</button>
            <div id="summary" style="margin-top:20px"></div>
            <div id="matrix"></div>
        </div>
    </div>
</div>

<nav class="bottom-nav" id="nav">
    <button class="active" data-target="page-users"><span class="nav-icon">👥</span>Teilnehmer</button>
    <button data-target="page-matchbox"><span class="nav-icon">💞</span>Matchbox</button>
    <button data-target="page-nights"><span class="nav-icon">🌙</span>Nights</button>
    <button data-target="page-ergebnisse"><span class="nav-icon">📊</span>Ergebnis</button>
</nav>

<div id="overlay">
    <div class="loader-card">
        <div style="font-weight:bold; margin-bottom:10px">Berechnung läuft...</div>
        <div class="progress-bar"><div class="progress-fill" id="pBar"></div></div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
